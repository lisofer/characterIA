<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado · Persona Studio</title><style>html{height:100%;background:#080e19;color:#edf6ff;font-family:system-ui,sans-serif}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;box-sizing:border-box}main{width:min(100%,390px);background:#132032;padding:25px;border:1px solid #34505a;border-radius:20px;box-sizing:border-box}h1{font-size:24px;margin:0 0 12px}p{color:#acc3d4;line-height:1.5}label{display:block;margin:20px 0 6px}input{display:block;width:100%;padding:15px;font-size:18px;border:1px solid #568777;border-radius:12px;background:#0b1625;color:white;box-sizing:border-box}button{margin-top:16px;width:100%;padding:15px;font-weight:700;border:0;border-radius:12px;background:#81edd0;color:#0b2023;font-size:16px}#err{color:#ffb4b7;min-height:24px}</style></head><body><main><h1>🔒 Persona Studio</h1><p>Acceso privado. Ingresá el token que configuraste en las variables de Railway.</p><form id="form"><label for="token">Token de acceso</label><input id="token" type="password" autocomplete="off" required autofocus><button type="submit">Entrar</button></form><p id="err" role="alert"></p></main><script>document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();let b=document.querySelector('button');b.disabled=true;document.getElementById('err').textContent='';try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});if(!r.ok)throw Error((await r.json()).error||'No se pudo ingresar');document.getElementById('token').value='';location.replace('/')}catch(e){document.getElementById('err').textContent=e.message}finally{b.disabled=false}})</script></body></html>
