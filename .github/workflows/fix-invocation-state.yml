name: Fix invocation state

on:
  push:
    paths:
      - ".github/workflows/fix-invocation-state.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
      - name: Patch invocation transition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lisofer/characteria/CharacterViewModel.kt')
          s = p.read_text()

          s = s.replace('import android.net.Uri\n', 'import android.net.Uri\nimport android.os.SystemClock\n', 1)

          old = '''    private var pendingInvocationProfileIds: List<String>? = null\n    private var activeBackgroundProfileIds: List<String> = emptyList()\n    private var conversationProfileIds: List<String> = emptyList()\n'''
          new = '''    private var pendingInvocationProfileIds: List<String>? = null\n    private var activeBackgroundProfileIds: List<String> = emptyList()\n    private var conversationProfileIds: List<String> = emptyList()\n    private var ignoreInvocationCommandsUntilMs: Long = 0L\n'''
          if old not in s:
              raise SystemExit('state fields pattern not found')
          s = s.replace(old, new, 1)

          old = '''                val targetProfiles = findInvocationProfiles(normalized)\n                if (targetProfiles.isNotEmpty()) {\n                    discardCurrentUserMessage()\n                    val targetIds = targetProfiles.map { it.id }\n'''
          new = '''                val targetProfiles = findInvocationProfiles(normalized)\n                if (targetProfiles.isNotEmpty()) {\n                    discardCurrentUserMessage()\n                    if (\n                        connectionPurpose == ConnectionPurpose.BACKGROUND_ACTIVE &&\n                        SystemClock.elapsedRealtime() < ignoreInvocationCommandsUntilMs\n                    ) {\n                        diag("Invocación residual ignorada al abrir la conversación")\n                        return\n                    }\n                    val targetIds = targetProfiles.map { it.id }\n'''
          if old not in s:
              raise SystemExit('invocation detection pattern not found')
          s = s.replace(old, new, 1)

          old = '''        activeBackgroundProfileIds = targetIds\n        conversationProfileIds = targetIds\n        groupLastSpeakerId = if (isGroup) {\n'''
          new = '''        activeBackgroundProfileIds = targetIds\n        conversationProfileIds = targetIds\n        connectionPurpose = ConnectionPurpose.BACKGROUND_ACTIVE\n        ignoreInvocationCommandsUntilMs = SystemClock.elapsedRealtime() + 1500L\n        groupLastSpeakerId = if (isGroup) {\n'''
          if old not in s:
              raise SystemExit('activation state pattern not found')
          s = s.replace(old, new, 1)

          old = '''        connectionPurpose = ConnectionPurpose.WAKE\n        activeBackgroundProfileIds = emptyList()\n        pendingInvocationProfileIds = null\n'''
          new = '''        connectionPurpose = ConnectionPurpose.WAKE\n        activeBackgroundProfileIds = emptyList()\n        pendingInvocationProfileIds = null\n        ignoreInvocationCommandsUntilMs = 0L\n'''
          if old not in s:
              raise SystemExit('return wake pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/CharacterViewModel.kt
          git commit -m "fix: enter active state after invocation"
          git push origin HEAD:feature/android-v01
