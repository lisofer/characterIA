name: Fix Live token JSON

on:
  push:
    paths:
      - ".github/workflows/fix-live-token-json.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
      - name: Patch Gemini Live token fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt')
          s = p.read_text()
          s = s.replace('.put("triggerTokens", 25_000)', '.put("triggerTokens", "25000")')
          s = s.replace('JSONObject().put("targetTokens", 8_000)', 'JSONObject().put("targetTokens", "8000")')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt
          git commit -m "fix: serialize Gemini Live token limits as int64 strings"
          git push origin HEAD:feature/android-v01
