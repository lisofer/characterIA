name: Inspect MuseTalk ONNX metadata

on:
  push:
    branches: [ "feature/characteria-musetalk" ]
    paths:
      - ".github/workflows/inspect-musetalk-onnx.yml"

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ONNX
        run: python -m pip install "onnx==1.19.0"
      - name: Download graph only
        run: |
          curl -L --fail --retry 3 -o /tmp/unet.onnx \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet.onnx?download=true"
      - name: Inspect inferred batched MatMul shapes
        run: |
          python - <<'PY'
          import onnx

          m = onnx.load('/tmp/unet.onnx', load_external_data=False)
          print('=== GRAPH INPUTS ===')
          for x in m.graph.input:
              print(x.name, [(d.dim_value if d.HasField('dim_value') else d.dim_param) for d in x.type.tensor_type.shape.dim])

          try:
              m = onnx.shape_inference.infer_shapes(m, check_type=False, strict_mode=False, data_prop=False)
              print('shape inference: OK')
          except Exception as e:
              print('shape inference warning:', repr(e))

          def shape(vi):
              if vi is None or not vi.type.HasField('tensor_type'):
                  return None
              result=[]
              for d in vi.type.tensor_type.shape.dim:
                  if d.HasField('dim_value'): result.append(d.dim_value)
                  elif d.HasField('dim_param'): result.append(d.dim_param)
                  else: result.append('?')
              return result

          all_vi=list(m.graph.input)+list(m.graph.output)+list(m.graph.value_info)
          info={vi.name:vi for vi in all_vi}
          init_shape={i.name:list(i.dims) for i in m.graph.initializer}

          print('=== RANK >= 3 MATMULS ===')
          for n in m.graph.node:
              if n.op_type != 'MatMul': continue
              a=shape(info.get(n.input[0])) or init_shape.get(n.input[0])
              b=shape(info.get(n.input[1])) or init_shape.get(n.input[1])
              rank=max(len(a or []), len(b or []))
              if rank >= 3:
                  flag=' *** ZERO/UNKNOWN ***' if any(v in (0,'?') for v in (a or [])+(b or [])) else ''
                  print(n.name, 'A=',a,'B=',b,flag)
          PY
