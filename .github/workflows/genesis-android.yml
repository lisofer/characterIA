name: Genesis Android APK

on:
  push:
    branches: [ "feature/genesis-v00" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish debug APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="genesis-debug-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Genesis v00 Debug ${GITHUB_RUN_NUMBER}" \
            --notes "APK experimental de Genesis v00, rama feature/genesis-v00." \
            --prerelease
