name: Android APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish versioned debug APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-debug-${GITHUB_RUN_NUMBER}"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ "$GITHUB_REF_NAME" == "feature/characteria-musetalk" ]]; then
            APK="CharacterIA-MuseTalk-debug-${GITHUB_RUN_NUMBER}.apk"
            TITLE="CharacterIA MuseTalk Debug ${GITHUB_RUN_NUMBER}"
            NOTES="CharacterIA MuseTalk 0.10. Corrige la preparación cancelada por rememberCoroutineScope: el preprocesado ahora usa un worker independiente de Compose y puede continuar aunque se cierre Ajustes. CancellationException ya no aparece como error neural. También se corrige el renderer para mantener una única sesión de lipsync por avatar y no reiniciarla con cada chunk PCM de Fish. Reutiliza íntegramente el motor MuseTalk ya instalado; no requiere volver a descargar ~2.08 GB."
          elif [[ "$GITHUB_REF_NAME" == "feature/characteria-vision" ]]; then
            APK="CharacterIA-Vision-debug-${GITHUB_RUN_NUMBER}.apk"
            TITLE="CharacterIA Visión Debug ${GITHUB_RUN_NUMBER}"
            NOTES="APK experimental de CharacterIA Visión. Se instala junto a CharacterIA estable."
          else
            APK="CharacterIA-debug-${GITHUB_RUN_NUMBER}.apk"
            TITLE="CharacterIA Android Debug ${GITHUB_RUN_NUMBER}"
            NOTES="APK de prueba generado automáticamente desde $GITHUB_REF_NAME."
          fi
          cp "$SOURCE_APK" "$APK"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease
