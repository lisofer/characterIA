name: Android APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload CharacterIA Sing artifact
        uses: actions/upload-artifact@v4
        with:
          name: CharacterIA-Sing-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish versioned debug APK
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
          (github.event_name == 'pull_request' && github.head_ref == 'feature/characteria-sing')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TAG="characteria-sing-${GITHUB_RUN_NUMBER}"
            TARGET_SHA="$PR_HEAD_SHA"
            SOURCE_BRANCH="$GITHUB_HEAD_REF"
            TITLE="CharacterIA Sing ${GITHUB_RUN_NUMBER}"
          else
            TAG="android-debug-${GITHUB_RUN_NUMBER}"
            TARGET_SHA="$GITHUB_SHA"
            SOURCE_BRANCH="$GITHUB_REF_NAME"
            TITLE="CharacterIA Android Debug ${GITHUB_RUN_NUMBER}"
          fi
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$TITLE" \
            --notes "APK de prueba generado automáticamente desde ${SOURCE_BRANCH}." \
            --prerelease
