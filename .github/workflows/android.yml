name: Android APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish versioned debug APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-debug-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          NAMED_APK="CharacterIA-Simli-debug-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$NAMED_APK"
          gh release create "$TAG" "$NAMED_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CharacterIA Simli Debug ${GITHUB_RUN_NUMBER}" \
            --notes "CharacterIA Simli 0.2. Corrige el panel negro: usa TextureView dentro de Compose, inicializa LiveKit/render en el hilo principal, calienta la sesión con 1 s de silencio PCM y no marca el avatar listo hasta recibir un frame real. Mantiene Fish -> PCM 16 kHz -> Simli y fallback local." \
            --prerelease
