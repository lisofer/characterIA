name: Android APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Apply pending Google Search patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/android-v01'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt')
          s = p.read_text()
          if 'JSONObject().put("googleSearch", JSONObject())' not in s:
              old = '            .put("inputAudioTranscription", JSONObject())\n            .put("outputAudioTranscription", JSONObject())\n'
              new = old + '            .put(\n                "tools",\n                JSONArray().put(JSONObject().put("googleSearch", JSONObject()))\n            )\n'
              if old not in s:
                  raise SystemExit('Gemini setup pattern not found')
              p.write_text(s.replace(old, new, 1))
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt
            git commit -m "feat: ground Gemini Live with Google Search"
            git push origin HEAD:feature/android-v01
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish versioned debug APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-debug-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CharacterIA Android Debug ${GITHUB_RUN_NUMBER}" \
            --notes "APK de prueba generado automáticamente desde feature/android-v01." \
            --prerelease
