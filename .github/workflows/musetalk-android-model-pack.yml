name: MuseTalk Android model pack

on:
  push:
    branches: [ "feature/characteria-musetalk" ]
    paths:
      - ".github/workflows/musetalk-android-model-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONNX tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "onnx==1.19.0"

      - name: Download known-working MuseTalk FP16 UNet
        shell: bash
        run: |
          mkdir -p model-src model-out
          curl -L --fail --retry 4 --retry-delay 5 \
            -o model-src/unet_fp16.onnx \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet_fp16.onnx?download=true"
          ls -lh model-src/unet_fp16.onnx

      - name: Patch CPU fallback islands to FP32
        shell: bash
        run: |
          cat > /tmp/patch_musetalk.py <<'PY'
          import collections
          import hashlib
          import os
          import onnx
          from onnx import helper, TensorProto

          source = "model-src/unet_fp16.onnx"
          output = "model-out/unet_android_safe_fp16.onnx"

          print("Loading original MuseTalk FP16 UNet…", flush=True)
          model = onnx.load_model(source, load_external_data=True)
          graph = model.graph

          counts = collections.Counter((n.domain or "ai.onnx", n.op_type) for n in graph.node)
          print("Operators:", sorted(counts.items()), flush=True)

          graph_output_types = {}
          for value in graph.output:
              try:
                  graph_output_types[value.name] = value.type.tensor_type.elem_type
              except Exception:
                  pass

          # The original FP16 export is kept intact. We only create small FP32
          # "islands" around operators that are not handled by NNAPI and are known
          # to be problematic when ORT CPU receives FP16. Heavy Conv/MatMul/Gemm
          # remain exactly as in the official FP16 model.
          #
          # input positions below are the floating data inputs for each schema.
          def fp32_input_positions(node):
              domain = node.domain or ""
              if domain == "com.microsoft" and node.op_type == "Gelu":
                  return list(range(len(node.input)))
              if node.op_type == "InstanceNormalization":
                  return [i for i in range(min(3, len(node.input)))]
              if node.op_type == "LayerNormalization":
                  return [i for i in range(min(3, len(node.input)))]
              if node.op_type in {"Erf", "Cos"}:
                  return [0] if node.input else []
              if node.op_type == "Where":
                  # condition stays bool; X/Y are floating tensors.
                  return [i for i in (1, 2) if i < len(node.input)]
              return None

          old_nodes = list(graph.node)
          del graph.node[:]
          patched = collections.Counter()

          for idx, node in enumerate(old_nodes):
              positions = fp32_input_positions(node)
              if positions is None:
                  graph.node.append(node)
                  continue

              key = f"{node.domain or 'ai.onnx'}::{node.op_type}"
              patched[key] += 1

              # Explicit FP16 -> FP32 casts make every floating input of the CPU
              # fallback operator agree on tensor(float), avoiding the exact mixed
              # InstanceNormalization type error seen on the Redmi device.
              for pos in positions:
                  if pos >= len(node.input) or not node.input[pos]:
                      continue
                  original = node.input[pos]
                  casted = f"{original}__cia_fp32_in_{idx}_{pos}"
                  graph.node.append(helper.make_node(
                      "Cast", [original], [casted],
                      name=f"CharacterIA_FP32_In_{idx}_{pos}",
                      to=TensorProto.FLOAT,
                  ))
                  node.input[pos] = casted

              original_outputs = list(node.output)
              internal_outputs = []
              for out_pos, original in enumerate(original_outputs):
                  if not original:
                      internal_outputs.append("")
                      continue
                  internal = f"{original}__cia_fp32_out_{idx}_{out_pos}"
                  internal_outputs.append(internal)
                  node.output[out_pos] = internal

              graph.node.append(node)

              # Return to the original FP16 graph immediately after the fallback
              # island. Preserve an FP32 graph output if the export declares one.
              for out_pos, original in enumerate(original_outputs):
                  if not original:
                      continue
                  target_type = graph_output_types.get(original, TensorProto.FLOAT16)
                  graph.node.append(helper.make_node(
                      "Cast", [internal_outputs[out_pos]], [original],
                      name=f"CharacterIA_FP16_Out_{idx}_{out_pos}",
                      to=target_type,
                  ))

          prop = model.metadata_props.add()
          prop.key = "characteria.android_safe_fp16"
          prop.value = "v1; original MuseTalk FP16 + FP32 fallback islands for Gelu/InstanceNorm/LayerNorm/Erf/Cos/Where"

          print("Patched nodes:", dict(patched), flush=True)
          if not patched:
              raise RuntimeError("No fallback nodes were patched; unexpected MuseTalk graph")

          # The checker performs schema/type validation. Because every patched
          # operator receives explicit Cast->FLOAT outputs, this catches malformed
          # type boundaries before the 1.6 GB model is published.
          print("Checking patched ONNX graph…", flush=True)
          onnx.checker.check_model(model, full_check=False)
          print("Saving…", flush=True)
          onnx.save_model(model, output)
          del model

          print("Checking saved model from path…", flush=True)
          onnx.checker.check_model(output, full_check=True)

          h = hashlib.sha256()
          with open(output, "rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  h.update(chunk)
          print(output, os.path.getsize(output), "sha256=" + h.hexdigest(), flush=True)
          PY
          python /tmp/patch_musetalk.py
          ls -lh model-out

      - name: Publish Android-safe FP16 model
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="musetalk-android-safe-fp16-v1"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            model-out/unet_android_safe_fp16.onnx \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuseTalk Android Safe FP16 v1" \
            --notes "Original MuseTalk 1.5 FP16 UNet with surgical FP32 fallback islands around Gelu, InstanceNormalization, LayerNormalization, Erf, Cos and Where. Heavy FP16 compute stays unchanged for Android NNAPI; model passes ONNX schema/type validation before publication."
