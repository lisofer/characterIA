name: MuseTalk Android model pack

on:
  push:
    branches: [ "feature/characteria-musetalk" ]
    paths:
      - ".github/workflows/musetalk-android-model-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONNX conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "onnx==1.19.0" "onnxconverter-common==1.16.0"

      - name: Download source MuseTalk ONNX UNet
        shell: bash
        run: |
          mkdir -p model-src model-out
          curl -L --fail --retry 4 --retry-delay 5 \
            -o model-src/unet.onnx \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet.onnx?download=true"
          curl -L --fail --retry 4 --retry-delay 5 \
            -o model-src/unet.onnx.data \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet.onnx.data?download=true"
          ls -lh model-src

      - name: Convert UNet to Android-safe mixed precision
        shell: bash
        run: |
          cat > /tmp/convert_musetalk.py <<'PY'
          import gc
          import os
          import onnx
          from onnxconverter_common.float16 import convert_float_to_float16

          source = "model-src/unet.onnx"
          output = "model-out/unet_android_mixed.onnx"
          external_name = "unet_android_mixed.onnx.data"

          print("Loading MuseTalk UNet + external weights…", flush=True)
          model = onnx.load_model(source, load_external_data=True)
          op_types = sorted({node.op_type for node in model.graph.node})
          print("UNet op types:", op_types, flush=True)

          # Strategy for Android:
          # Keep only the compute-heavy linear/convolution kernels in FP16.
          # Everything else stays FP32 so any node rejected by NNAPI can execute
          # safely on ORT CPU. This specifically prevents com.microsoft::Gelu
          # from receiving tensor(float16), which ORT CPU does not implement.
          fp16_heavy_ops = {"Conv", "ConvTranspose", "MatMul", "Gemm"}
          never_block = {"Cast"}
          blocked = sorted(set(op_types) - fp16_heavy_ops - never_block)
          print("Keeping FP32:", blocked, flush=True)

          model = convert_float_to_float16(
              model,
              keep_io_types=True,
              disable_shape_infer=True,
              op_block_list=blocked,
          )

          # Mark the modified model so it is obvious which pack the app uses.
          prop = model.metadata_props.add()
          prop.key = "characteria.android_mixed_precision"
          prop.value = "v1; FP16 Conv/ConvTranspose/MatMul/Gemm; other ops FP32"

          print("Saving external-data model…", flush=True)
          onnx.save_model(
              model,
              output,
              save_as_external_data=True,
              all_tensors_to_one_file=True,
              location=external_name,
              size_threshold=1024,
              convert_attribute=False,
          )
          del model
          gc.collect()

          for path in [output, os.path.join("model-out", external_name)]:
              print(path, os.path.getsize(path), flush=True)
          PY
          python /tmp/convert_musetalk.py
          ls -lh model-out

      - name: Publish Android mixed model pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="musetalk-android-mixed-v1"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            model-out/unet_android_mixed.onnx \
            model-out/unet_android_mixed.onnx.data \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuseTalk Android Mixed Precision v1" \
            --notes "MuseTalk 1.5 UNet converted for CharacterIA Android. Heavy Conv/ConvTranspose/MatMul/Gemm kernels remain FP16; remaining operators stay FP32 so ORT CPU fallback does not receive unsupported FP16 activations such as com.microsoft::Gelu. Derived from DgDev91/MuseTalk-ONNX / TMElyralab MuseTalk."
