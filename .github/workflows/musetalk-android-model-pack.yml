name: MuseTalk Android model pack

on:
  push:
    branches: [ "feature/characteria-musetalk" ]
    paths:
      - ".github/workflows/musetalk-android-model-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONNX conversion tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "onnx==1.19.0" "onnxconverter-common==1.16.0"

      - name: Download source MuseTalk ONNX UNet
        shell: bash
        run: |
          mkdir -p model-src model-out
          curl -L --fail --retry 4 --retry-delay 5 \
            -o model-src/unet.onnx \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet.onnx?download=true"
          curl -L --fail --retry 4 --retry-delay 5 \
            -o model-src/unet.onnx.data \
            "https://huggingface.co/DgDev91/MuseTalk-ONNX/resolve/main/unet.onnx.data?download=true"
          ls -lh model-src

      - name: Convert UNet to Android-safe mixed precision v2
        shell: bash
        run: |
          cat > /tmp/convert_musetalk.py <<'PY'
          import gc
          import hashlib
          import os
          import onnx
          from onnxconverter_common.float16 import convert_float_to_float16

          source = "model-src/unet.onnx"
          output = "model-out/unet_android_mixed_v2.onnx"
          external_name = "unet_android_mixed_v2.onnx.data"

          print("Loading MuseTalk UNet + external weights…", flush=True)
          model = onnx.load_model(source, load_external_data=True)
          op_types = sorted({node.op_type for node in model.graph.node})
          print("UNet op types:", op_types, flush=True)

          # NNAPI's documented operator set includes Conv, MatMul and Gemm.
          # Keep ONLY those compute-heavy ops in FP16. Everything else remains
          # FP32 so an unsupported NNAPI node can safely fall back to ORT CPU.
          # Shape inference MUST stay enabled: the converter uses inferred types
          # to insert the Cast nodes at every FP16 <-> FP32 boundary.
          fp16_nnapi_ops = {"Conv", "MatMul", "Gemm"}
          blocked = sorted(set(op_types) - fp16_nnapi_ops - {"Cast"})
          print("FP16 / NNAPI candidates:", sorted(fp16_nnapi_ops & set(op_types)), flush=True)
          print("Keeping FP32:", blocked, flush=True)

          model = convert_float_to_float16(
              model,
              keep_io_types=True,
              disable_shape_infer=False,
              op_block_list=blocked,
          )

          prop = model.metadata_props.add()
          prop.key = "characteria.android_mixed_precision"
          prop.value = "v2; FP16 Conv/MatMul/Gemm only; shape-inferred boundary casts; all other ops FP32"

          # Strict checker catches exactly the failure seen on the phone in v1:
          # an InstanceNormalization node receiving float16 + float inputs.
          print("Running strict ONNX checker + shape/type inference…", flush=True)
          onnx.checker.check_model(model, full_check=True)
          inferred = onnx.shape_inference.infer_shapes(model, strict_mode=True, data_prop=False)
          onnx.checker.check_model(inferred, full_check=True)
          del inferred
          gc.collect()

          print("Saving external-data model…", flush=True)
          onnx.save_model(
              model,
              output,
              save_as_external_data=True,
              all_tensors_to_one_file=True,
              location=external_name,
              size_threshold=1024,
              convert_attribute=False,
          )
          del model
          gc.collect()

          data_path = os.path.join("model-out", external_name)
          for path in [output, data_path]:
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                      h.update(chunk)
              print(path, os.path.getsize(path), "sha256=" + h.hexdigest(), flush=True)
          PY
          python /tmp/convert_musetalk.py
          ls -lh model-out

      - name: Publish Android mixed model pack v2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="musetalk-android-mixed-v2"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            model-out/unet_android_mixed_v2.onnx \
            model-out/unet_android_mixed_v2.onnx.data \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MuseTalk Android Mixed Precision v2" \
            --notes "MuseTalk 1.5 UNet for CharacterIA Android. v2 keeps only NNAPI-friendly Conv/MatMul/Gemm in FP16, all other ops in FP32, enables shape inference so boundary Casts are inserted correctly, and passes strict ONNX type/schema validation before publication."
