name: Apply group UI patch

on:
  push:
    paths:
      - "scripts/patch_group_ui.py"
      - ".github/workflows/apply-group-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
      - name: Apply patch
        run: python3 scripts/patch_group_ui.py
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/MainActivity.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: show active speaker in group conversations"
          git push origin HEAD:feature/android-v01
