name: Group autonomous dialogue

on:
  push:
    paths:
      - ".github/workflows/group-autonomous-dialogue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
      - name: Patch natural multi-speaker group turns
        run: python3 scripts/patch_group_dialogue.py
      - name: Commit group dialogue support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/CharacterViewModel.kt
          git commit -m "feat: let paired characters converse naturally"
          git push origin HEAD:feature/android-v01
