name: Group autonomous dialogue

on:
  push:
    paths:
      - ".github/workflows/group-autonomous-dialogue.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
