name: Enable Google Search

on:
  push:
    paths:
      - ".github/workflows/enable-google-search.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01
      - name: Enable Google Search in Gemini Live
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt')
          s = p.read_text()
          old = '''            .put("inputAudioTranscription", JSONObject())
            .put("outputAudioTranscription", JSONObject())
            .put(
                "contextWindowCompression",
'''
          new = '''            .put("inputAudioTranscription", JSONObject())
            .put("outputAudioTranscription", JSONObject())
            .put(
                "tools",
                JSONArray().put(JSONObject().put("googleSearch", JSONObject()))
            )
            .put(
                "contextWindowCompression",
'''
          if old not in s:
              raise SystemExit('Gemini setup pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit Google Search support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/gemini/GeminiLiveClient.kt
          git commit -m "feat: ground Gemini Live with Google Search"
          git push origin HEAD:feature/android-v01
