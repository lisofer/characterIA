name: Apply named invocation patch

on:
  push:
    paths:
      - "scripts/patch_named_invocation.py"
      - ".github/workflows/apply-named-invocation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v01

      - name: Apply patch
        run: python3 scripts/patch_named_invocation.py

      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/lisofer/characteria/CharacterViewModel.kt \
                  app/src/main/java/com/lisofer/characteria/MainActivity.kt \
                  app/src/main/java/com/lisofer/characteria/InvocationForegroundService.kt
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "feat: invoke and switch characters by name"
            git push origin HEAD:feature/android-v01
          fi
